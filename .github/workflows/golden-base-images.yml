name: Build Golden Base Images

on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: "Build a single Ruby version (leave blank for all)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "Dockerfile.golden"
      - ".github/workflows/golden-base-images.yml"

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: golden-base-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rails-golden
  RUBY_VERSIONS: >-
    3.4.4

jobs:
  prepare-matrix:
    name: Prepare version matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build version matrix JSON
        id: set-matrix
        run: |
          if [[ -n "${{ github.event.inputs.ruby_version }}" ]]; then
            VERSIONS='["${{ github.event.inputs.ruby_version }}"]'
          else
            VERSIONS=$(echo '${{ env.RUBY_VERSIONS }}' \
              | tr ' ' '\n' \
              | grep -v '^$' \
              | jq -R . \
              | jq -sc .)
          fi
          echo "matrix={\"ruby_version\":${VERSIONS}}" >> "$GITHUB_OUTPUT"

  build-golden:
    name: "Golden image • Ruby ${{ matrix.ruby_version }}"
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ matrix.ruby_version }}
            type=semver,pattern={{minor}},value=${{ matrix.ruby_version }}
            type=semver,pattern={{major}},value=${{ matrix.ruby_version }}

      - name: Build golden image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.golden
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUBY_VERSION=${{ matrix.ruby_version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=golden-${{ matrix.ruby_version }}
          cache-to: type=gha,scope=golden-${{ matrix.ruby_version }},mode=max

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.ruby_version }}
          format: "sarif"
          output: "trivy-results-${{ matrix.ruby_version }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln,secret,misconfig"
          timeout: "10m"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results-${{ matrix.ruby_version }}.sarif"
          category: "trivy-golden-ruby-${{ matrix.ruby_version }}"

      - name: Notify on scan failure
        if: failure() && steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL/HIGH CVEs in Ruby ${{ matrix.ruby_version }} golden image."
          echo "Check the Security tab for the full SARIF report."

  all-golden-images-ready:
    name: All golden images ready
    needs: build-golden
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix jobs passed
        run: |
          if [[ "${{ needs.build-golden.result }}" != "success" ]]; then
            echo "One or more golden image builds failed. Check individual jobs."
            exit 1
          fi
          echo "All golden images built, scanned, and pushed successfully."
